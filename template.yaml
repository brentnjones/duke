apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: openshift-app-with-certmanager
  title: Onboard New App to OpenShift with TLS (cert-manager)
  description: >
    Scaffolds a new application on OpenShift with automated TLS certificate
    provisioning via cert-manager. Creates a namespace, deploys the app,
    and configures a signed certificate through a ClusterIssuer.
  tags:
    - openshift
    - cert-manager
    - tls
    - recommended
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: platform-team
  type: service

  # ─────────────────────────────────────────────────────────────────
  # Step 1 – Collect information from the developer
  # ─────────────────────────────────────────────────────────────────
  parameters:
    - title: Application Details
      required:
        - appName
        - appDescription
        - owner
        - system
      properties:
        appName:
          title: Application Name
          type: string
          description: Unique name for your application (lowercase, no spaces)
          pattern: '^[a-z0-9\-]+$'
          ui:autofocus: true
        appDescription:
          title: Description
          type: string
          description: Short description of what this application does
        owner:
          title: Owner Team
          type: string
          description: Team responsible for this application
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
        system:
          title: System
          type: string
          description: The system this application belongs to
          ui:field: EntityPicker
          ui:options:
            allowedKinds:
              - System

    - title: OpenShift Configuration
      required:
        - namespace
        - environment
        - replicas
        - containerImage
      properties:
        namespace:
          title: Target Namespace
          type: string
          description: OpenShift namespace to deploy into (will be created if it does not exist)
          pattern: '^[a-z0-9\-]+$'
        environment:
          title: Environment
          type: string
          default: dev
          enum:
            - dev
            - test
            - staging
            - prod
          enumNames:
            - Development
            - Test
            - Staging
            - Production
        replicas:
          title: Initial Replica Count
          type: integer
          default: 1
          minimum: 1
          maximum: 10
        containerImage:
          title: Container Image
          type: string
          default: quay.io/openshift/origin-hello-openshift:latest
          description: "Use a publicly pullable image or configure an image pull secret for private registries."
        containerPort:
          title: Container Port
          type: integer
          default: 8080
        resourceLimits:
          title: Resource Limits
          type: object
          properties:
            cpu:
              title: CPU Limit
              type: string
              default: "500m"
            memory:
              title: Memory Limit
              type: string
              default: "512Mi"

    - title: TLS / cert-manager Configuration
      required:
        - clusterIssuer
        - hostname
      properties:
        clusterIssuer:
          title: ClusterIssuer
          type: string
          description: cert-manager ClusterIssuer to use for certificate signing (must exist in the target cluster)
          default: letsencrypt-prod-dns01
        hostname:
          title: Application Hostname
          type: string
          description: "Fully-qualified domain name for the Route, e.g. myapp.apps.cluster.example.com"
        tlsSecretName:
          title: TLS Secret Name
          type: string
          description: Name of the Kubernetes Secret that will store the certificate (auto-generated if blank)

    - title: Source Control
      required:
        - repoOwner
      properties:
        repoOwner:
          title: Repository Owner / Group
          type: string
          ui:field: RepoOwnerPicker
          ui:options:
            host: gitlab.com
        repoName:
          title: Repository Name
          type: string
          description: Optional. Leave blank to use a unique default based on the app name and environment.
          pattern: '^[a-z0-9\-]+$'
        argoProjectName:
          title: ArgoCD Project Name
          type: string
          description: Optional. Override the ArgoCD project name used by GitOps registration. Use this if you rerun demos and hit duplicate project errors.
          pattern: '^[a-z0-9\-]+$'

  # ─────────────────────────────────────────────────────────────────
  # Step 2 – Execute scaffolding actions
  # ─────────────────────────────────────────────────────────────────
  steps:
    - id: fetch-skeleton
      name: Fetch Application Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          appName: ${{ parameters.appName }}
          appDescription: ${{ parameters.appDescription }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          namespace: ${{ parameters.namespace }}
          environment: ${{ parameters.environment }}
          replicas: ${{ parameters.replicas }}
          containerImage: ${{ parameters.containerImage }}
          containerPort: ${{ parameters.containerPort | default(8080) }}
          cpuLimit: ${{ parameters.resourceLimits.cpu | default("500m") }}
          memoryLimit: ${{ parameters.resourceLimits.memory | default("512Mi") }}
          clusterIssuer: ${{ parameters.clusterIssuer }}
          hostname: ${{ parameters.hostname }}
          tlsSecretName: ${{ parameters.tlsSecretName | default(parameters.appName + "-tls") }}
          repoUrl: gitlab.com?owner=${{ parameters.repoOwner }}&repo=${{ parameters.repoName | default(parameters.appName + "-" + parameters.environment) }}

    - id: publish-gitlab
      name: Publish to GitLab
      action: publish:gitlab
      input:
        repoUrl: gitlab.com?owner=${{ parameters.repoOwner }}&repo=${{ parameters.repoName | default(parameters.appName + "-" + parameters.environment) }}
        defaultBranch: main
        repoVisibility: public

    - id: create-argocd-app-gitlab
      name: Register GitLab App in ArgoCD / GitOps
      action: argocd:create-resources
      input:
        appName: ${{ parameters.appName }}-${{ parameters.environment }}
        argoInstance: main
        projectName: ${{ parameters.argoProjectName | default(parameters.repoName | default(parameters.appName + "-" + parameters.environment)) }}
        namespace: ${{ parameters.namespace }}
        repoUrl: ${{ steps['publish-gitlab'].output.remoteUrl }}.git
        path: manifests
        labelValue: ${{ parameters.appName }}

    - id: register-catalog-gitlab
      name: Register GitLab Component in RHDH Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-gitlab'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # ─────────────────────────────────────────────────────────────────
  # Step 3 – Surface useful links after scaffolding completes
  # ─────────────────────────────────────────────────────────────────
  output:
    links:
      - title: Open Repository
        url: ${{ steps['publish-gitlab'].output.remoteUrl }}
        icon: gitlab
      - title: View in Software Catalog
        icon: catalog
        entityRef: ${{ steps['register-catalog-gitlab'].output.entityRef }}
      - title: Application URL (TLS)
        url: https://${{ parameters.hostname }}
        icon: web
      - title: OpenShift Console – Namespace
        url: https://${{ parameters.hostname | replace(parameters.appName, "console-openshift-console") }}/k8s/cluster/namespaces/${{ parameters.namespace }}
        icon: openshift
